kind = "web"
previewPath = "/"
title = "SREC FC Food Court"
description = "A mobile-first campus food court ordering app for Sri Ramakrishna Engineering College, with live menu availability, fast pickup checkout, simulated UPI payment, persistent order history, and digital thermal receipts."
version = "1.0.0"
id = "artifacts/srec-fc"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22315

[services.development]
run = "pnpm --filter @workspace/srec-fc run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/srec-fc", "run", "build" ]
serve = "static"
publicDir = "artifacts/srec-fc/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22315"
BASE_PATH = "/"
